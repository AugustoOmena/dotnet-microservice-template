services:
  postgres:
    image: postgres:17-alpine
    container_name: microservice-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: AdminPassword123!
      POSTGRES_DB: microservice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d microservice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: